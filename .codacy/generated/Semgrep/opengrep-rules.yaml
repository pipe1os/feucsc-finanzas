  - id: javascript_eval_rule-eval-with-expression
    languages:
      - javascript
      - typescript
    patterns:
      - pattern-either:
          - patterns:
              - pattern: |
                  eval($OBJ)
              - pattern-not: |
                  eval("...")
          - patterns:
              - pattern: |
                  $A.eval($OBJ)
              - pattern-not: |
                  $A.eval("...")
          - patterns:
              - pattern: |
                  (..., eval)($OBJ)
              - pattern-not: |
                  (..., eval)("...")
          - patterns:
              - pattern: |
                  $ALIAS = eval;
                  ...
                  $ALIAS($OBJ)
              - pattern-not: |
                  $ALIAS = eval;
                  ...
                  $ALIAS("...")
          - pattern: |
              new Function(..., "..." + $OBJ + "...")
          - pattern: |
              $BODY = "..." + $OBJ + "..."
              ...
              new Function(..., $BODY)
          - pattern: |
              new Function(..., `...${...}...`)
          - pattern: |
              $BODY = `...${...}...`
              ...
              new Function(..., $BODY)
          - pattern: |
              Function(..., "..." + $OBJ + "...")
          - pattern: |
              $BODY = "..." + $OBJ + "..."
              ...
              Function(..., $BODY)
          - pattern: |
              $BODY = `...${...}...`
              ...
              Function(..., $BODY)
          - pattern: |
              Function(..., `...${...}...`)
          - pattern: |
              setTimeout("..." + $OBJ + "...", ...)
          - pattern: |
              setTimeout(`...${...}...`, ...)
          - pattern: |
              setInterval("..." + $OBJ + "...", ...)
          - pattern: |
              setInterval(`...${...}...`, ...)
      - pattern-not: |
