  - id: javascript.sequelize.security.audit.sequelize-tls-disabled-cert-validation.sequelize-tls-disabled-cert-validation
    message: Set "rejectUnauthorized" to false is a convenient way to resolve
      certificate error. But this method is unsafe because it disables the
      server certificate verification, making the Node app open to MITM attack.
      "rejectUnauthorized" option must be alway set to True (default value).
      With self -signed certificate or custom CA, use "ca" option to define Root
      Certificate. This rule checks TLS configuration only for Postgresql,
      MariaDB and MySQL. SQLite is not really concerned by TLS configuration.
      This rule could be extended for MSSQL, but the dialectOptions is specific
      for Tedious.
    metadata:
      cwe:
        - "CWE-94: Improper Control of Generation of Code ('Code Injection')"
      owasp:
        - A03:2021 - Injection
      references:
        - https://node-postgres.com/features/ssl
        - https://nodejs.org/api/tls.html#tls_class_tls_tlssocket
        - https://nodejs.org/api/tls.html#tls_tls_createsecurecontext_options
      category: security
      technology:
        - sequelize
      cwe2022-top25: true
      subcategory:
        - audit
      likelihood: LOW
      impact: LOW
      confidence: LOW
    languages:
      - javascript
      - typescript
    severity: ERROR
    patterns:
      - pattern: |
          {
            host: $HOST,
            database: $DATABASE,
            dialect: $DIALECT,
            dialectOptions: {
              ssl: {
                rejectUnauthorized: false
              }
            }
           }
      - metavariable-regex:
          metavariable: $DIALECT
          regex: "['\"](mariadb|mysql|postgres)['\"]"
  - id: javascript.sequelize.security.audit.sequelize-weak-tls-version.sequelize-weak-tls-version
    message: TLS1.0 and TLS1.1 are deprecated and should not be used anymore. By
      default, NodeJS used TLSv1.2. So, TLS min version must not be downgrade to
      TLS1.0 or TLS1.1. Enforce TLS1.3 is highly recommended This rule checks
      TLS configuration only for PostgreSQL, MariaDB and MySQL. SQLite is not
      really concerned by TLS configuration. This rule could be extended for
      MSSQL, but the dialectOptions is specific for Tedious.
    metadata:
      cwe:
        - "CWE-319: Cleartext Transmission of Sensitive Information"
      owasp:
        - A03:2017 - Sensitive Data Exposure
        - A02:2021 - Cryptographic Failures
      references:
        - https://node-postgres.com/features/ssl
        - https://nodejs.org/api/tls.html#tls_class_tls_tlssocket
        - https://nodejs.org/api/tls.html#tls_tls_createsecurecontext_options
        - https://nodejs.org/api/tls.html#tls_tls_default_min_version
      category: security
      technology:
        - sequelize
      subcategory:
        - audit
      likelihood: LOW
      impact: LOW
      confidence: LOW
    languages:
      - javascript
      - typescript
    severity: WARNING
    patterns:
      - pattern-inside: |
          {
            host: $HOST,
            database: $DATABASE,
            dialect: $DIALECT,
            dialectOptions:
              { ssl: ... }
           }
      - pattern-either:
          - pattern: |
              {
                minVersion: 'TLSv1'
              }
          - pattern: |
              {
